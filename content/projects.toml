[[items]]
title = "WowCai: 2026 FIFA World Cup and Gaokao Admission Forecasting"
subtitle = "Advisor: Dr. Xiaogang Xu"
date = "2026 - Present"
content = "Built an agentic deep-research workflow that retrieves and synthesizes multi-source evidence, structures schedules and historical records, and runs Monte Carlo score and tournament simulations to forecast all 104 World Cup matches. Applied the same evidence-grounded workflow to 2026 Gaokao cutoffs using 2021-2025 score and rank histories, province- and subject-specific interval estimation, and backtesting against released cutoffs."
tags = ["Deep Research", "Multi-Agent Systems", "Monte Carlo Simulation", "Forecasting"]
